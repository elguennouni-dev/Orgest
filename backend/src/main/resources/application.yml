server:
  address: ${SERVER_ADDRESS:127.0.0.1}   # derrière Nginx uniquement
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      tracking-modes: cookie
  tomcat:
    max-swallow-size: 8MB
  compression:
    enabled: true
spring:
  application:
    name: orgest
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/orgest}
    username: ${DB_USER:orgest}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
orgest:
  jwt-secret: ${JWT_SECRET:}              # >= 32 caractères, obligatoire
  jwt-ttl-hours: ${JWT_TTL_HOURS:12}
  cookie-secure: ${COOKIE_SECURE:true}
  upload-dir: ${UPLOAD_DIR:/var/lib/orgest/uploads}
  admin-username: ${ORGEST_ADMIN_USERNAME:admin}
  admin-password: ${ORGEST_ADMIN_PASSWORD:}
  max-login-attempts: 5
  lock-minutes: 15
  site-url: ${SITE_URL:}                    # ex. https://orgest.tech (sinon déduit des en-têtes du proxy)
  index-file: ${INDEX_FILE:}              # index.html construit (gabarit des pages SEO)
  index-url: ${INDEX_URL:}                # ou URL du frontend (Docker : http://web/index.html)
  whatsapp: ${ORGEST_WHATSAPP:212680376294}
management:
  endpoints:
    access:
      default: none
logging:
  level:
    root: INFO
