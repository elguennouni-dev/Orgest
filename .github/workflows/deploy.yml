name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Backend (compilation + tests)
        run: mvn -B -q -f backend/pom.xml verify
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend (build)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Déploiement SSH sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          for v in SSH_KEY KNOWN_HOSTS HOST; do
            [ -n "${!v}" ] || { echo "::error::Secret manquant pour $v : créez VPS_HOST / VPS_USER / VPS_KNOWN_HOSTS / VPS_SSH_KEY dans Settings > Secrets and variables > Actions > onglet Secrets (pas Variables)."; exit 1; }
          done
          install -m 700 -d ~/.ssh
          # Clé acceptée en base64 (une ligne, recommandé) ou en clair (bloc BEGIN/END)
          case "$SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy ;;
            *) printf '%s' "$SSH_KEY" | tr -d ' \r\n' | base64 -d > ~/.ssh/id_deploy ;;
          esac
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null || { echo "::error::VPS_SSH_KEY illisible : recréez le secret avec la sortie de setup-ci-deploy.sh --rotate (ligne base64)."; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # La clé est limitée côté serveur à « orgest-deploy » (commande forcée) : aucun autre accès.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${SSH_USER:-root}@${HOST}" deploy
